<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: black;

        }
        h1{
        color: violet;
        font-family: 20px;
        align-items: center;
        }
        .container{
            display: grid;
            grid-template-columns:repeat(3,1fr);
            gap: 20px;
        }
        .product{
            background-color: blanchedalmond;
            border-radius: 20px;
            padding: 12px;
            box-shadow: 2px 2px 10px burlywood;


        }
        .product img{
            width: 100px;
            height: auto;

        }
        .price{
            color: deepskyblue;
            font-family: 600px;
            font-weight: bold;
        }
        button{
            background-color: olive;
            color: black;
            border-radius: 25px;
            border: 1px solid gray;
            padding: 15px 12px;
            cursor: pointer;
        }
        button:hover{
            background-color: blue;
        }





      </style>








</head>
<body>
    <h1>vegtables produts</h1>

    <div class="container">
        <div class="product">
            <img src="" alt="">
           <h3>tomato</h3>
           <div class="price"> 20</div>
           <button>buy now</button>

        </div>

        <div class="product">
            <img src="" alt="">
            <h3>cabbage</h3>
            <div class="price"> 25</div>
            <button>buy now</button>
        </div>
        <div class="product">  
            <img src="" alt="">
            <h3>pumpkin</h3>
            <div class="price"> 30</div>
            <button>buy now</button>
        </div>

        <div class="product">
            <img src="" alt="">
            <h3>beet root</h3>
            <div class="price"> 40</div>
            <button>buy now</button>


        </div>














    </div>
</body>
</html>
